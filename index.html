<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover：切り欠きのある端末で全面表示し、操作部品は safe-area で内側へ寄せる -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1f16" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="stylesheet" href="/style.css">
    <title>戦国探索記 試作第一号</title>
</head>

<body class="mode-title">
    <div id="app">
        <div id="game-container"></div>

        <div id="ui">
            <!-- 上部：目的とメニュー -->
            <div id="hud-top">
                <div id="objective" aria-live="polite"></div>
                <button id="menu-btn" type="button" aria-label="メニュー">メニュー</button>
            </div>

            <div id="area-banner" aria-live="polite"></div>

            <!-- キーボード用の案内（タッチ端末では非表示） -->
            <div id="prompt" hidden><kbd>Space</kbd><span class="prompt-label"></span></div>

            <!-- 会話 -->
            <div id="dialogue" hidden>
                <div id="dialogue-speaker"></div>
                <div id="dialogue-text"></div>
                <div id="dialogue-next">▼</div>
            </div>

            <!-- スマホ用操作 -->
            <div id="touch-controls">
                <div id="stick-zone">
                    <div id="stick-base"><div id="stick-knob"></div></div>
                </div>
                <button id="action-btn" type="button" class="idle">話す</button>
            </div>

            <div id="toast" role="status" aria-live="polite"></div>
        </div>

        <!-- タイトル -->
        <section id="title" class="overlay">
            <div class="card allow-scroll">
                <h1>戦国探索記</h1>
                <p class="sub">試作第一号</p>
                <div class="buttons">
                    <button id="btn-new" type="button">はじめから</button>
                    <button id="btn-continue" type="button" disabled>つづきから</button>
                </div>
                <p id="save-info"></p>
                <p id="save-warning" class="warning" hidden></p>
                <div class="help">
                    <p class="help-touch">左側をなぞって移動　右下のボタンで話す・次へ</p>
                    <p class="help-keys">移動：矢印キー / WASD　話す・次へ：Space / Enter / Z　メニュー：Esc</p>
                </div>
            </div>
        </section>

        <!-- メニュー -->
        <section id="menu" class="overlay" hidden>
            <div class="card allow-scroll" role="dialog" aria-label="メニュー">
                <h2>メニュー</h2>
                <p id="menu-save-info"></p>
                <button id="btn-save" type="button">端末に保存する</button>
                <p id="menu-status" role="status" aria-live="polite"></p>
                <div class="buttons">
                    <button id="btn-close" type="button">閉じる</button>
                    <button id="btn-title" type="button" class="secondary">タイトルへ戻る</button>
                </div>
            </div>
        </section>

        <!-- 縦画面の案内（タッチ端末のみ） -->
        <div id="rotate-hint">
            <div class="rotate-icon" aria-hidden="true">⟳</div>
            <p>端末を横向きにしてお遊びください</p>
        </div>

        <div id="boot-error" hidden></div>
        <div id="safe-probe" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
