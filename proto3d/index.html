<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#15130f" />
    <title>戦国探索記 3D比較版</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <div id="app">
        <div id="view"></div>
        <div id="look-zone"></div>
        <div id="hud">
            <div class="chip"><b>3D 比較版</b><span class="cam-tps">試作・肩越しの探索</span><span class="cam-top">試作・固定カメラ</span></div>
        </div>
        <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
        <button id="hero-btn" type="button" aria-label="主人公の見た目を切り替え"><span class="cap">主人公</span><span class="v1">新</span><span class="old">旧</span></button>
        <button id="run-btn" type="button" aria-pressed="false" aria-label="歩く／走るを切り替え"><span class="walk">歩く</span><span class="run">走る</span></button>
        <p id="help"><span class="keys">移動 <kbd>←↑↓→</kbd> <kbd>WASD</kbd>　走る <kbd>Shift</kbd>（押している間）<span class="look">　見回す <kbd>ドラッグ</kbd></span></span><span class="touch">左側で移動<span class="look">・右側をなぞって見回す</span>・右下で歩く／走る</span></p>
        <p id="build"></p>
        <div id="loading">読み込み中…</div>
        <div id="fps" hidden></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
</body>
</html>
